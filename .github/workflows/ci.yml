name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: auth_methods_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci_cd_test_jwt_secret_key_123456789
      DATABASE_URL: postgresql+psycopg://postgres:root@localhost:5432/auth_methods_test
      GOOGLE_CLIENT_ID: mock_google_client_id
      GOOGLE_CLIENT_SECRET: mock_google_client_secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/oauth/google/callback

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check --fix

      - name: Run tests
        run: pytest -v